[workspace]
members = ["core", "src-tauri"]
resolver = "3"

[workspace.package]
version = "3.0.0"
edition = "2024"
# let-chains (`if let … && let …`) exist from Rust 1.88.
rust-version = "1.88"
publish = false

[workspace.lints.rust]
# core forbids unsafe via `#![forbid]`; the app layer needs exactly one justified
# spot (WebView2 settings) that it explicitly allows.
unsafe_code = "deny"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# No use for an application (not a library):
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[profile.release]
lto = true
codegen-units = 1
opt-level = "s"
strip = true
# Deliberately no panic = "abort": a panic in a background task must not end the app.

[profile.dev.package."*"]
# Dependencies (SQLite, regex, HTML parser) stay fast in the debug build too.
opt-level = 2
