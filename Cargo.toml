[workspace]
members = ["core", "src-tauri"]
resolver = "3"

[workspace.package]
version = "3.0.0"
edition = "2024"
# let-Ketten (`if let … && let …`) gibt es ab Rust 1.88.
rust-version = "1.88"
publish = false

[workspace.lints.rust]
# core verbietet unsafe per `#![forbid]`; die App-Schicht braucht genau eine
# begründete Stelle (WebView2-Einstellungen), die sie ausdrücklich freigibt.
unsafe_code = "deny"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Für eine Anwendung (keine Bibliothek) ohne Nutzen:
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[profile.release]
lto = true
codegen-units = 1
opt-level = "s"
strip = true
# Bewusst kein panic = "abort": Eine Panik in einem Hintergrund-Task darf die App nicht beenden.

[profile.dev.package."*"]
# Abhängigkeiten (SQLite, Regex, HTML-Parser) auch im Debug-Build zügig.
opt-level = 2
