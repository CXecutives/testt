[package]
name = "jobalert-core"
description = "Domain logic of the Job-Alert-Monitor: mails, portals, storage, export - no Tauri."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
async-imap = { version = "0.11.3", default-features = false, features = ["runtime-tokio"] }
ego-tree = "0.11"
fastrand = "2"
jiff = { version = "0.2.37", features = ["serde"] }
keyring = "4.2"
log = { version = "0.4", features = ["std"] }
mail-parser = "0.11.9"
regex = "1"
# TLS via rustls with ring (not aws-lc: no extra C toolchain needed).
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "http2", "system-proxy", "cookies", "gzip", "brotli"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
rust_xlsxwriter = { version = "0.99.1", features = ["jiff"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-platform-verifier = "0.6"
scraper = "0.27"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["macros", "net", "sync", "time"] }
tokio-io-timeout = "1"
tokio-rustls = { version = "0.26.5", default-features = false, features = ["logging", "tls12", "ring"] }
tokio-util = "0.7"
url = "2.5"

[dev-dependencies]
calamine = "0.36"
insta = "1"
rpassword = "7"
flate2 = "1"
# Tests: their own runtime, simulated time, duplex streams for the IMAP protocol.
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "time", "test-util", "io-util"] }
wiremock = "0.6"
ts-rs = { version = "12.0.1", features = ["jiff-impl"] }
