[package]
name = "job-alert-monitor"
description = "Job-Alert-Monitor - Tauri interface"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

# A program, not a library: all tests live in `core` (Tauri-linked test executables fail on
# Windows without the app manifest). Compile-time checks cover what lives here.
[[bin]]
name = "job-alert-monitor"
path = "src/main.rs"
test = false

[build-dependencies]
tauri-build = { version = "2.6", features = [] }

[dependencies]
jobalert-core = { path = "../core" }
log = "0.4"
open = "5"
rfd = "0.17"
serde = { version = "1", features = ["derive"] }
# The language of the OS (the app's default language): no dependencies of its own on
# Windows and macOS, no unsafe code here (src/platform.rs).
sys-locale = "0.3"
serde_json = "1"
jiff = "0.2"
fastrand = "2"
# 2.11.1 fixes CVE-2026-42184 (remote pages could call local commands).
tauri = { version = "2.11.5", features = [] }
tauri-plugin-single-instance = "2.4"
tokio = { version = "1", features = ["sync", "time", "macros"] }
tokio-util = "0.7"

[target.'cfg(windows)'.dependencies]
# The same versions as in Tauri (nothing extra to compile): access to the WebView2 settings
# that Tauri does not pass through, and the colours of the native title bar (DWM), both in
# src/platform.rs.
webview2-com = "0.38"
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_UI_Input_KeyboardAndMouse"] }
windows-core = "0.61"

[target.'cfg(target_os = "macos")'.dependencies]
# The same versions and features as in tao (nothing extra to compile): the traffic lights of
# the unified title bar, placed in src/platform.rs.
dispatch2 = "0.3"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "objc2-core-foundation", "NSButton", "NSControl", "NSResponder", "NSView", "NSWindow"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSGeometry", "objc2-core-foundation"] }
